<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab46_3</title>
    <style>
        body {
            margin: 0;
            font-family: Arial;
            background: #f4f4f4;
        }

        .gallery {
            display:grid;
            grid-template-columns:repeat(auto-fill,minmax(200px,1fr));
            gap:15px;
            padding:20px;
        }

        .gallery img { width:100%; cursor:pointer; }

        .modal {
            display:none;
            position:fixed;
            width:100%;
            height:100%;
            background:rgba(0,0,0,0.8);
            justify-content:center;
            align-items:center;
        }

        .modal-content {
            position:relative;
        }

        .modal img {
            max-width:80vw;
        }

        .nav {
            position:absolute;
            top:50%;
            font-size:40px;
            color:white;
            cursor:pointer;
        }

        .prev { left:-50px; }
        .next { right:-50px; }

        .close {
            position:absolute;
            top:-40px;
            right:0;
            font-size:30px;
            color:white;
            cursor:pointer;
        }
    </style>
</head>
<body>
    <div class="gallery">
        <img src="https://picsum.photos/id/1015/600/400">
        <img src="https://picsum.photos/id/1016/600/400">
        <img src="https://picsum.photos/id/1018/600/400">
    </div>

    <div class="modal" id="modal">
        <div class="modal-content">
            <span class="close" id="close">&times;</span>
            <span class="nav prev" id="prev">&#10094;</span>
            <img id="modal-img">
            <span class="nav next" id="next">&#10095;</span>
        </div>
    </div>

    <script>
    const images = document.querySelectorAll(".gallery img");
    const modal = document.getElementById("modal");
    const modalImg = document.getElementById("modal-img");
    const closeBtn = document.getElementById("close");
    const nextBtn = document.getElementById("next");
    const prevBtn = document.getElementById("prev");

    let current = 0;

    images.forEach((img,index)=>{
        img.onclick=()=>{
            modal.style.display="flex";
            modalImg.src=img.src;
            current=index;
        };
    });

    nextBtn.onclick=()=>{
        current=(current+1)%images.length;
        modalImg.src=images[current].src;
    };

    prevBtn.onclick=()=>{
        current=(current-1+images.length)%images.length;
        modalImg.src=images[current].src;
    };

    closeBtn.onclick=()=>modal.style.display="none";
    </script>
</body>
</html>
