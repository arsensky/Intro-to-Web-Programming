<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab46_Bonus</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f4f4;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
            padding: 20px;
        }

        .gallery img {
            width: 100%;
            cursor: pointer;
            border-radius: 10px;
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .gallery img:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 15px rgba(0,0,0,0.2);
        }

        .modal {
            display: none;
            position: fixed;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            justify-content: center;
            align-items: center;
            animation: fadeIn 0.3s ease;
        }

        .modal-content {
            position: relative;
            animation: zoomIn 0.3s ease;
        }

        .modal img {
            max-width: 80vw;
            max-height: 80vh;
            border-radius: 10px;
            transition: opacity 0.2s;
        }

        .close {
            position: absolute;
            top: -40px;
            right: 0;
            font-size: 30px;
            color: white;
            cursor: pointer;
        }

        .nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            font-size: 40px;
            color: white;
            cursor: pointer;
            padding: 10px;
            user-select: none;
        }

        .prev { left: -60px; }
        .next { right: -60px; }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes zoomIn {
            from { transform: scale(0.8); }
            to { transform: scale(1); }
        }
    </style>
</head>
<body>
    <div class="gallery" id="gallery"></div>

    <div class="modal" id="modal">
        <div class="modal-content">
            <span class="close" id="close">&times;</span>
            <span class="nav prev" id="prev">&#10094;</span>
            <img id="modal-img">
            <span class="nav next" id="next">&#10095;</span>
        </div>
    </div>

    <script>
    const images = [
        "https://picsum.photos/id/1015/600/400",
        "https://picsum.photos/id/1016/600/400",
        "https://picsum.photos/id/1018/600/400",
        "https://picsum.photos/id/1020/600/400",
        "https://picsum.photos/id/1024/600/400"
    ];

    const gallery = document.getElementById("gallery");
    const modal = document.getElementById("modal");
    const modalImg = document.getElementById("modal-img");
    const closeBtn = document.getElementById("close");
    const nextBtn = document.getElementById("next");
    const prevBtn = document.getElementById("prev");

    let currentIndex = 0;

    images.forEach((src, index) => {
        const img = document.createElement("img");
        img.src = src;
        img.onclick = () => openModal(index);
        gallery.appendChild(img);
    });

    function openModal(index) {
        currentIndex = index;
        modal.style.display = "flex";
        modalImg.src = images[currentIndex];
        localStorage.setItem("lastViewedPro", currentIndex);
    }

    function closeModal() {
        modal.style.display = "none";
    }

    function showNext() {
        currentIndex = (currentIndex + 1) % images.length;
        updateImage();
    }

    function showPrev() {
        currentIndex = (currentIndex - 1 + images.length) % images.length;
        updateImage();
    }

    function updateImage() {
        modalImg.style.opacity = 0;
        setTimeout(() => {
            modalImg.src = images[currentIndex];
            modalImg.style.opacity = 1;
            localStorage.setItem("lastViewedPro", currentIndex);
        }, 150);
    }

    closeBtn.onclick = closeModal;

    modal.onclick = (e) => {
        if (e.target === modal) closeModal();
    };

    nextBtn.onclick = showNext;
    prevBtn.onclick = showPrev;

    window.onload = () => {
        const saved = localStorage.getItem("lastViewedPro");
        if (saved !== null) {
            openModal(parseInt(saved));
        }
    };
    </script>
</body>
</html>
